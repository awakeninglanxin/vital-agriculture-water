<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 940 780" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="舒伯格生命经济与技术机械经济对照图（中文重绘）">
  <defs>
    <style>
      .txt{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;}
    </style>
  </defs>
  <!-- 外框 -->
  <rect x="16" y="16" width="908" height="713" fill="#fefcf6" stroke="#a8403c" stroke-width="3"/>
  <!-- 黑色横轴 -->
  <line x1="70" y1="375" x2="688" y2="375" stroke="#26262b" stroke-width="4"/>
  <polygon points="686,367 708,375 686,383" fill="#26262b"/>
  <g class="txt">
    <!-- 轴上方业态 -->
    <text x="140" y="356" font-size="13" fill="#26262b" text-anchor="middle">无变化</text>
    <text x="340" y="356" font-size="13" fill="#26262b" text-anchor="middle">永恒匀速运动</text>
    <text x="540" y="356" font-size="13" fill="#26262b" text-anchor="middle">100% 效率</text>
    <!-- 轴下方小字 -->
    <text x="175" y="400" font-size="11" fill="#4a4a4a" text-anchor="middle">均匀</text>
    <text x="385" y="400" font-size="11" fill="#4a4a4a" text-anchor="middle">恒定</text>
    <!-- 轴右端说明 -->
    <text x="700" y="428" font-size="12.5" fill="#2f8f3f">100% 效率不带来任何东西，</text>
    <text x="700" y="446" font-size="12.5" fill="#2f8f3f">只会永恒地维持现状。</text>
  </g>

  <!-- 左上：生命框（绿） -->
  <polygon points="50,118 250,118 300,187 250,256 50,256 50,118" fill="rgba(47,143,63,.05)" stroke="#2f8f3f" stroke-width="2.5"/>
  <g class="txt" fill="#2f8f3f" font-size="15">
    <text x="62" y="140">演进</text>
    <text x="62" y="158">发展</text>
    <text x="62" y="176">秩序递增</text>
    <text x="62" y="194">成长</text>
    <text x="62" y="212">稳定</text>
    <text x="62" y="230">效率</text>
    <text x="62" y="248">超经济</text>
    <text x="318" y="196" font-size="27" font-weight="bold">= 生命</text>
  </g>
  <!-- 左下：死亡框（棕） -->
  <polygon points="50,470 250,470 300,539 250,608 50,608 50,470" fill="rgba(138,106,47,.05)" stroke="#8a6a2f" stroke-width="2.5"/>
  <g class="txt" fill="#8a6a2f" font-size="15">
    <text x="62" y="492">退化</text>
    <text x="62" y="510">劣化</text>
    <text x="62" y="528">混乱递增</text>
    <text x="62" y="546">衰败</text>
    <text x="62" y="564">不稳定</text>
    <text x="62" y="582">低效</text>
    <text x="62" y="600">破产</text>
    <text x="318" y="548" font-size="27" font-weight="bold">= 死亡</text>
  </g>

  <!-- 蓝色上弧线（恢复性生态技术） -->
  <path d="M 100 350 Q 380 302 650 208" fill="none" stroke="#1f7fc0" stroke-width="4"/>
  <line x1="650" y1="208" x2="690" y2="170" stroke="#1f7fc0" stroke-width="4"/>
  <polygon points="684,165 702,153 697,177" fill="#1f7fc0"/>
  <g class="txt">
    <text x="288" y="268" font-size="15" fill="#2f8f3f" font-weight="bold">恢复性生态技术</text>
    <text x="288" y="288" font-size="11" fill="#4a8a4a">幅度递增方向</text>
    <text x="585" y="152" font-size="15" fill="#2f8f3f" text-anchor="middle" font-weight="bold">· 负熵 ·</text>
    <text x="585" y="172" font-size="14" fill="#2f8f3f" text-anchor="middle">终极秩序</text>
  </g>

  <!-- 蓝色下弧线（现代技术） -->
  <path d="M 100 400 Q 380 448 650 542" fill="none" stroke="#1f7fc0" stroke-width="4"/>
  <line x1="650" y1="542" x2="690" y2="578" stroke="#1f7fc0" stroke-width="4"/>
  <polygon points="684,582 702,595 697,571" fill="#1f7fc0"/>
  <g class="txt">
    <text x="288" y="472" font-size="15" fill="#8a6a2f" font-weight="bold">现代技术</text>
    <text x="288" y="492" font-size="11" fill="#9a7a4a">幅度递增方向</text>
    <text x="585" y="602" font-size="15" fill="#8a6a2f" text-anchor="middle" font-weight="bold">· 熵 ·</text>
    <text x="585" y="622" font-size="14" fill="#8a6a2f" text-anchor="middle">终极混乱</text>
  </g>

  <!-- 右上：自然经济系统框（绿菱形） -->
  <polygon points="730,40 902,150 902,300 730,332 558,300 558,150" fill="rgba(47,143,63,.06)" stroke="#2f8f3f" stroke-width="3"/>
  <g class="txt" fill="#2f8f3f">
    <text x="730" y="82" font-size="16" font-weight="bold" text-anchor="middle" text-decoration="underline">自然经济系统</text>
    <text x="730" y="100" font-size="10" text-anchor="middle" fill="#5a8a5a">NATURE'S ECONOMIC SYSTEM</text>
    <text x="730" y="122" font-size="12.5" text-anchor="middle">1% = 用于能量使用的红利</text>
    <text x="730" y="180" font-size="12.5" text-anchor="middle">10% = 用于进一步增长的资本利息</text>
    <text x="730" y="250" font-size="12.5" text-anchor="middle">100% = 不可触碰的资本基础</text>
    <text x="730" y="300" font-size="22" font-weight="bold" text-anchor="middle">超经济</text>
  </g>
  <!-- 增益箭头向上 -->
  <g stroke="#2f8f3f" fill="none" stroke-width="1.8">
    <line x1="735" y1="166" x2="735" y2="140"/><polygon points="730,142 735,132 740,142" fill="#2f8f3f"/>
    <line x1="735" y1="236" x2="735" y2="206"/><polygon points="730,208 735,198 740,208" fill="#2f8f3f"/>
  </g>
  <g class="txt">
    <text x="745" y="156" font-size="10" fill="#2f8f3f">因效率而增益</text>
    <text x="745" y="226" font-size="10" fill="#2f8f3f">因效率而增益</text>
  </g>

  <!-- 右下：技术机械经济系统框（棕菱形） -->
  <polygon points="730,430 902,540 902,690 730,722 558,690 558,540" fill="rgba(138,106,47,.06)" stroke="#8a6a2f" stroke-width="3"/>
  <g class="txt" fill="#8a6a2f">
    <text x="730" y="472" font-size="16" font-weight="bold" text-anchor="middle" text-decoration="underline">技术机械经济系统</text>
    <text x="730" y="490" font-size="10" text-anchor="middle" fill="#9a8a6a">TECHNO-MECHANICAL ECONOMIC SYSTEM</text>
    <text x="730" y="512" font-size="12.5" text-anchor="middle">100% = 投入资本</text>
    <text x="730" y="570" font-size="12.5" text-anchor="middle">10% = 可用于再投资的资本</text>
    <text x="730" y="640" font-size="12.5" text-anchor="middle">1% = 可用于再投资的资本</text>
    <text x="730" y="698" font-size="22" font-weight="bold" text-anchor="middle">破产</text>
  </g>
  <!-- 损耗箭头向下 -->
  <g stroke="#8a6a2f" fill="none" stroke-width="1.8">
    <line x1="735" y1="600" x2="735" y2="624"/><polygon points="730,622 735,634 740,622" fill="#8a6a2f"/>
    <line x1="735" y1="530" x2="735" y2="556"/><polygon points="730,554 735,566 740,554" fill="#8a6a2f"/>
  </g>
  <g class="txt">
    <text x="745" y="618" font-size="10" fill="#8a6a2f">因低效而损耗</text>
    <text x="745" y="548" font-size="10" fill="#8a6a2f">因低效而损耗</text>
  </g>

  <!-- 底部来源 -->
  <text x="470" y="726" font-size="11" fill="#8a7a5a" text-anchor="middle" class="txt">译自《生命的能量》 Callum Coats（Living Energies, 1996）</text>

  <!-- 可点击：阅读人物介绍 -->
  <a xlink:href="点我_舒伯格人物介绍_ViktorSchauberger.md" target="_blank" rel="noopener">
    <rect x="290" y="742" width="360" height="32" rx="16" fill="#5f83a6"/>
    <text x="470" y="763" font-size="14" fill="#fff" text-anchor="middle" class="txt" font-weight="bold">▶ 阅读 Viktor Schauberger 人物介绍</text>
  </a>
</svg>
